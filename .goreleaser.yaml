# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: poo

builds:
  - id: poo
    binary: poo
    main: ./cmd/poo
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: poo
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - examples/*

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  draft: false
  prerelease: false

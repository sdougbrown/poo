# yaml-language-server: $schema=https://goreleaser.com/static/schema.json
version: 2

project_name: poo

builds:
  - id: poo
    binary: poo
    main: ./cmd/poo
    env:
      - CGO_ENABLED=0
    # The binary answers --version from its own build information: the
    # module version, or the VCS stamp of the checkout it was built from.
    # Nothing here stamps a version, so nothing here can go stale.
    ldflags:
      - -s -w
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - id: poo
    formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - examples/*

checksum:
  name_template: checksums.txt

changelog:
  disable: true

release:
  draft: false
  prerelease: false

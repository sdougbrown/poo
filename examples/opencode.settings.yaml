# A session on the OpenCode Console gateway: no endpoints block, no
# models block. One key serves every OpenCode endpoint, because a key
# belongs to one workspace and the workspace's plan says which endpoint
# bills it.
#
#     poo run --settings examples/opencode.settings.yaml "..."
#
# `poo login opencode` stores the key in poo's credential file. With no
# explicit auth_file, poo uses its default credential file. On macOS,
# poo checks ~/Library/Application Support/poo/auth.json first, then uses
# ~/.config/poo/auth.json only when that alternate file exists. Other
# platforms use their platform config directory. See the README for the
# full discovery rules.
#
# To keep poo's credential beside this settings file, opt in explicitly:
# auth_file: auth.json
# Ordinary login stores in poo's default file:
#     poo login opencode --settings examples/opencode.settings.yaml
# If auth_file is uncommented, pass the same --settings to login so it
# writes to the named file.
version: 1

profile: code

roles:
  chat: opencode-go/glm-5.3

# The gateway speaks the Anthropic Messages API beside the Chat
# Completions one, at its own base, so the endpoints come in pairs and
# a Messages model is a role away:
#
# roles:
#   chat: opencode-go-anthropic/claude-haiku-5-5
#
# The Messages transport carries the thinking a model did — with the
# signature the response carried, returned unchanged in the history that
# answers it — so a Messages model that reasons keeps its reasoning
# across turns.

# The skills the person keeps, in the directory the rest of the family
# uses, and further directories beside it. A path that is not there is
# dropped with a warning rather than failing the run.
skills:
  default: true
  paths: ["./skills"]

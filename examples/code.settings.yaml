# The settings a coding session runs under.
#
# Every key is optional unless the plan marks it required, and an
# unknown key is an error. The file may be JSON, TOML or YAML; the
# extension says which.
#
# The command reads it with:
#
#     poo run --settings examples/code.settings.yaml "..."
#
# The precedence is the profile, then this file, then the command
# line: the last one that says something wins.

version: 1

# The profile the session is built from: base, code or search.
#
# The code profile offers bash, read, grep and edit, and it allows
# every side-effecting call no rule covers. That is the mini-swe-agent
# stance: the isolation is the operator's job, and it is done with a
# sandbox or a container.
profile: code

# pi's Codex provider is built in: name the credential file to run one of
# its models, and assign `openai-codex/<id>` to a role. The OAuth token is
# sent only to the built-in Codex endpoint. See the README for credential
# discovery and for when to use pi_auth_file.
#
# To keep poo's credential beside this settings file, opt in explicitly:
# auth_file: auth.json
# Then pass this same settings file to login:
#     poo login codex --settings examples/code.settings.yaml

# The endpoints the models are served by, and the models themselves.
endpoints:
  home:
    endpoint: "http://localhost:4000/v1"
    # The key comes from the environment variable this names, and from
    # the `api_key` beside it when that variable is not set. The variable
    # is scrubbed from the child environment, so a command the model runs
    # cannot read the credential.
    api_key_env: "HOME_MODELS_KEY"

# An operator with a credential file skips the endpoints block above and
# runs a built-in provider. poo ships records for pi's Codex provider and
# for the OpenCode Console gateway (pay-as-you-go and Go, Chat Completions
# and Anthropic Messages); the models come out of the settings when the
# credential is there:
#
#     roles:
#       chat: openai-codex/gpt-6.1-sol
#
# One key serves every OpenCode endpoint, and `poo login opencode` stores
# it:
#
#     roles:
#       chat: opencode-go/glm-5.3

models:
  gemma4:
    endpoint: home
    model_id: "gemma4"
    api: chat_completions
    tools_mode: native
    ops: [chat, systemone, decisions]
    inputs: [text]
    context_limit: 131072

# The roles the models fill. The chat model is the one a session
# cannot run without; the decider model is the one the permission
# chain asks.
roles:
  chat: gemma4
  decider: gemma4

# The permission policy.
permission:
  # What to do with a side-effecting call no rule covers. The profile's
  # own action applies when this is absent.
  unmatched: ask
  # The decision when the asker chain is exhausted. The default is deny.
  fallback: deny
  # A call the model keeps making is a permission case.
  doom_loop:
    threshold: 3
    near_threshold: 5
    action: ask
  # The rules, in order. The first match wins. A rule matches on the
  # tool's name or on the tool's class, never on both.
  rules:
    - tool: bash
      command_prefix: "git status"
      action: allow
    - class: read_only
      action: allow
  # The asker chain, in order. The decide asker needs a decider model.
  # An empty list means no askers, so an ask goes straight to the fallback;
  # an absent list takes the binary's own chain.
  askers: [decide]
  chain_timeout_s: 120
  # The decision asker's thresholds.
  decide:
    allow: 0.85
    deny: 0.99
    timeout_ms: 1500

# The context window's ratios. The notice ratio is when the model is
# told that the context is filling up; the hard ratio is when the run
# stops.
#
# The strategy decides what happens before it stops:
#   summary — the oldest turns become a model-written summary, the newest
#             turns stay verbatim, and the run carries on
#   handoff — the model writes a note for whoever continues the task, and
#             the run ends with it
#   none    — the run ends when the window is full
context:
  notice_ratio: 0.8
  hard_ratio: 0.97
  strategy: summary
  handoff:
    ratio: 0.90
    max_tokens: 2048
  summary:
    ratio: 0.85
    # How much of the newest history stays verbatim.
    keep_recent_tokens: 20000
    max_tokens: 4096

# The tools.
tools:
  bash:
    timeout_s: 120
    # The executor the commands run through: local, or bwrap when the
    # binary links the sandbox. A name the binary does not link is an
    # error, and the command never falls back to another executor.
    executor: bwrap
  bwrap:
    # The sandbox has the host's network unless this is false.
    network: true
    ro_binds: ["/usr", "/bin", "/lib", "/lib64", "/etc"]
    rw_binds: []
  # The child environment: the names to remove, and the names to keep
  # and nothing else. A passthrough list limits the environment to
  # exactly the names on it.
  env:
    scrub: []
    passthrough: []
  # The paths the tools must not touch, as globs on the resolved
  # paths. A glob is absolute, or starts with "~".
  #
  # The file tools (read, grep and edit) refuse a protected path. The
  # bash tool cannot: with the local executor a command reaches
  # anything the process can, and with the bwrap executor the sandbox
  # masks the protected paths inside the directories it binds.
  #
  # The example protects the operator's own secrets from a model that
  # goes looking:
  #
  #     protected_paths:
  #       - "~/.ssh"
  #       - "~/.aws"
  #       - "/etc/shadow"
  protected_paths: []

  # The fetch tool reads the network. The code profile offers it; an
  # operator who wants the model off the network names it in
  # tools.disabled. Its settings:
  fetch:
    # How long one fetch waits, in seconds.
    timeout_s: 30
    # The largest body one fetch reads.
    max_bytes: 4194304
    # The user agent a fetch sends. Empty means a generic one that
    # carries nothing about the user.
    user_agent: ""
    # The fetch of a loopback or private address is refused unless
    # this is true. A link-local address (the cloud metadata service
    # lives there) and the reserved ranges are refused either way.
    allow_private_hosts: false
  # A model that must not reach the network disables the tool here:
  # disabled: [fetch]

# The registered command-line tools. A path is a manifest file, a
# directory of manifests, or several of them, resolved against the
# working directory unless they start with ~/. Every manifest is loaded
# when the session is built, and a name two manifests define fails the
# load.
#
# Naming a registry offers the registry's tools to a profile that already
# offers a side-effecting tool: call_cli runs one registered CLI, and a
# catalog over thirty entries with a decider model is searched with
# find_tool instead of listed. A registered CLI runs through the same
# executor as bash, so a sandboxed session runs it in the sandbox;
# docs/sandbox.md says what that means.
cli_registry:
  paths: []

# The run's limits. A limit of zero is off.
limits:
  max_tokens_per_run: 0
  max_duration_s: 0
  max_turns: 0
  max_continuations: 3

# The background jobs.
jobs:
  max_running: 4
  timeout_s: 1800
  # What happens to a result that arrives while the session is idle:
  # wake starts a new run with it, hold waits for the next one.
  on_idle: wake
  max_unattended_wakes: 0

# The reasoning level the chat model runs at: off, low, medium, high
# or a budget in tokens.
reasoning:
  chat: off

# The per-model sampling overrides. A field left out is not sent.
sampling:
  gemma4:
    temperature: 1.0
    top_p: 0.95

# The skills the person keeps: each a directory with a SKILL.md naming what
# it does. The prompt carries the catalog — a line per skill — and the model
# reads the guidance with the read tool when a description fits the task.
#
# `default` reads the directory the rest of the family keeps skills in
# (~/.agents/skills); `user_path` names another, and the two are mutually
# exclusive. `paths` are further directories, resolved against the working
# directory or starting with ~/, and one that is not there is dropped with a
# warning rather than failing the run. All of it is a convention rather than
# a promise: a directory that is not there holds no skills, and the run
# carries on.
skills:
  default: true
  # user_path: "~/.my-skills"
  # paths: ["./skills"]

# The session.
session:
  # logged writes the session's records; ephemeral writes nothing.
  mode: logged
  dir: "~/.local/state/poo/sessions"
  # Retention is opt-in: a prune with neither an age nor a count
  # deletes nothing.
  retention:
    max_age_days: 30
    max_sessions: 500
  # The prompt carries a layer for the user's own instructions and one for
  # the project's, and both are conventions rather than promises: a layer
  # that is on and holds no instructions adds no section.
  #
  # `user_prompt: true` reads the operator's own instructions from
  # AGENTS.md in poo's config directory; `user_prompt_file` names the file
  # instead, which is how an operator whose rules already live somewhere
  # else — the file their other harnesses read — keeps them one copy
  # instead of one per tool. `project_prompt: true` reads the working
  # directory's AGENTS.md, or CLAUDE.md when there is none, and the loader
  # never walks up to a parent.
  user_prompt: true
  # user_prompt_file: "~/.config/poo/AGENTS.md"
  project_prompt: true

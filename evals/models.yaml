# The models a baseline is measured against.
#
# Each entry is one model the harness runs against. The name is the key a
# report and a comparison use, so it stays stable.
#
# api_key_env names the environment variable holding the key. The runner
# passes the name to the poo subprocess and never reads the value: the
# binary reads it and scrubs it from the tools' child environment. (The
# judge reads its own key, named by poo-eval judge --api-key-env.)
#
# context_limit is the model's context window in tokens. The harness
# passes it to poo as --context-limit, and poo computes the output room
# from it.
#
# tools_mode is native, text or auto. It is native unless a model needs
# the text tool-call parser.

- name: gemma4
  endpoint: http://localhost:4000/v1
  model_id: gemma4
  context_limit: 32768
  tools_mode: auto
  notes: >-
    Capped from 262144 on purpose: the low-budget run. The cap makes the
    context limit bite, so the harness's context handling is measured.
    The tools mode is auto, not native: a smoke test on 2026-10-20
    showed gemma4 writing its tool calls as text rather than through the
    wire format, so the text parser has to read them.

- name: gemma4-think
  endpoint: http://localhost:4000/v1
  model_id: gemma4
  context_limit: 32768
  tools_mode: auto
  reasoning_effort: low
  notes: >-
    gemma4 with thinking on. gemma4 thinks only when the request asks it
    to, so this entry sends reasoning_effort low and keeps everything else
    the same as the gemma4 entry: the same 32768 cap and the same tools
    mode. It shows what thinking changes for the same weights.

- name: qwen
  endpoint: http://localhost:4000/v1
  model_id: qwen
  context_limit: 262144
  notes: >-
    Streams reasoning_content. The provider keeps it separate from the
    answer, so the transcript shows the model's thinking.

- name: minimax-m3.1-flash
  endpoint: https://ollama.com/v1
  model_id: minimax-m3.1-flash
  api_key_env: OLLAMA_API_KEY
  context_limit: 262144
  notes: >-
    Capped from 1M. Thinks before answering.

- name: glm-flash
  endpoint: http://grace:4000/v1
  model_id: glm-flash
  context_limit: 32768
  notes: >-
    The home router's GLM, capped to 32768 so the window bites: a
    compaction model at a size where compaction is measured, not
    hypothetical. Native tool calls.

- name: deepseek-flash-128k
  endpoint: http://grace:4000/v1
  model_id: deepseek-flash
  context_limit: 131072
  notes: >-
    The home router's deepseek alias, capped to 131072: the middle
    window where the long tasks strain but a compaction is still
    possible. Native tool calls.

- name: gemma4-16k
  endpoint: http://localhost:4000/v1
  model_id: gemma4
  context_limit: 16384
  tools_mode: auto
  notes: >-
    gemma4 capped to 16384: the window where the long-read task's
    compaction fires mid-run, whatever the model does. The keep-recent
    tail the runs pin keeps the cut meaningful at this size.

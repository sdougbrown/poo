name: Checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # The sandbox needs unprivileged user namespaces. Ubuntu 24.04
          # restricts them for unprivileged binaries, and the knob is
          # absent on the kernels that do not.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Vet
        run: go vet ./...

      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Prompt lint
        run: ./scripts/lint-prompts.sh

      - name: Test
        run: go test -race ./...

      - name: Conformance
        run: go test -race -v -run TestTheBinary ./cmd/poo/

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

  cross:
    name: Cross-build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      # GoReleaser builds every target .goreleaser.yaml names, so the
      # release's own target list is what compiles here: a Linux-only
      # syscall added to a shared file fails this instead of failing the
      # tag. `build --snapshot` publishes nothing and needs no token.
      - name: Build every release target
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: build --snapshot --clean

  executors:
    name: Executors (bubblewrap)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # The sandbox needs unprivileged user namespaces. Ubuntu 24.04
          # restricts them for unprivileged binaries, and the knob is
          # absent on the kernels that do not.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Check the sandbox
        run: |
          if ! bwrap --unshare-all --ro-bind / / -- /bin/true; then
            echo "::warning::bubblewrap cannot create a sandbox here; the required config, cli-registry and feed sandbox tests will fail"
          fi

      - name: Executors
        run: go test -race -v ./config/ ./tool/cliregistry/ ./exec/bwrap/ ./internal/bashverify/ ./tool/bash/ ./feed/

      - name: Conformance in the sandbox
        env:
          POO_CONFORMANCE_EXECUTOR: bwrap
        run: go test -race -v -run TestTheBinarySpeaksTheProtocol ./cmd/poo/

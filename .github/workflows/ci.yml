name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Vet
        run: go vet ./...

      - name: Format
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt'd:" >&2
            echo "$unformatted" >&2
            exit 1
          fi

      - name: Prompt lint
        run: ./scripts/lint-prompts.sh

      - name: Test
        run: go test -race ./...

      - name: Conformance
        run: go test -race -v -run TestTheBinary ./cmd/poo/

      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

  executors:
    name: Executors (bubblewrap)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Install bubblewrap
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap
          # The sandbox needs unprivileged user namespaces. Ubuntu 24.04
          # restricts them for unprivileged binaries, and the knob is
          # absent on the kernels that do not.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Check the sandbox
        run: |
          if ! bwrap --unshare-all --ro-bind / / -- /bin/true; then
            echo "::warning::bubblewrap cannot create a sandbox here; the executor tests will skip and say so"
          fi

      - name: Executors
        run: go test -race -v ./exec/bwrap/ ./internal/bashverify/ ./tool/bash/

      - name: Conformance in the sandbox
        env:
          POO_CONFORMANCE_EXECUTOR: bwrap
        run: go test -race -v -run TestTheBinarySpeaksTheProtocol ./cmd/poo/
